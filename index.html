<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS Experiments</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0b0d14;color:#f5f0e1;font-family:'Segoe UI',system-ui,sans-serif;padding:40px 20px;
  }
  h1{font-weight:600;letter-spacing:.5px;margin-bottom:8px;}
  p.sub{color:#9a9fb0;margin-top:0;margin-bottom:32px;}
  ul{list-style:none;padding:0;margin:0;width:100%;max-width:420px;}
  li+li{margin-top:12px;}
  a{
    display:block;padding:16px 20px;border-radius:12px;background:#161925;border:1px solid #2a2f42;
    color:#FFD700;text-decoration:none;font-weight:500;transition:background .2s ease, transform .15s ease;
  }
  a:hover{background:#1e2233;transform:translateY(-2px);}
</style>
</head>
<body>
  <h1>SS Experiments</h1>
  <p class="sub">Páginas y pruebas publicadas</p>
  <ul>
    <li><a href="gift-cristina-polanco-21sep/">🌻 Gift · Cristina Polanco (21 sep)</a></li>
  </ul>
</body>
</html>
