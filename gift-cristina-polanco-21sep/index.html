<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxia de Flores Amarillas · Cristina Polanco</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap');

:root{
    --bg-deep:#060815;
    --bg-mid:#170a2e;
    --gold:#FFD700;
    --gold-light:#FFED4E;
    --gold-warm:#FFC700;
    --orange:#FF8C42;
    --purple:#6B2D8F;
    --text-strong:#FFFACD;
    --text-soft:#F5F0E1;
    --star-color:#FFE87C;
    --modal-bg:linear-gradient(160deg, rgba(23,10,46,.96) 0%, rgba(6,8,21,.97) 100%);
    --modal-border:#FFD700;
    --attribution-color:rgba(255,215,0,.55);
    --name-color:#FF6FB0;
    --name-glow:rgba(255,111,176,.7);
}
:root[data-theme="light"]{
    --bg-deep:#FFF4D6;
    --bg-mid:#FFE6A0;
    --gold:#C98A00;
    --gold-light:#E8A800;
    --gold-warm:#D69800;
    --orange:#C9611A;
    --purple:#9B6BC9;
    --text-strong:#4A3200;
    --text-soft:#3A2800;
    --star-color:#E8B400;
    --modal-bg:linear-gradient(160deg, rgba(255,248,230,.97) 0%, rgba(255,235,190,.98) 100%);
    --modal-border:#C98A00;
    --attribution-color:rgba(120,80,0,.6);
    --name-color:#E0459B;
    --name-glow:rgba(224,69,155,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
    width:100%;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 65%);
    transition:background .8s ease;
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
}

/* ---------- 3D scene skeleton ---------- */
#scene{
    position:fixed;inset:0;
    perspective:1300px;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
    user-select:none;
}
#scene.dragging{cursor:grabbing;}
#starsLayer{position:fixed;inset:0;z-index:0;}
#camera{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
#nebulaLayer{position:absolute;inset:-10%;transform:translateZ(-500px) scale(1.4);}
#sparksLayer{position:absolute;inset:0;transform-style:preserve-3d;}
#flowersLayer{position:absolute;inset:0;transform-style:preserve-3d;}

.star{position:absolute;border-radius:50%;background:radial-gradient(circle, var(--star-color) 0%, transparent 75%);animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}
.nebula{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;animation:nebulaDrift 18s ease-in-out infinite;}
@keyframes nebulaDrift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-25px) scale(1.15);}}

.flower{position:absolute;left:50%;top:50%;margin-left:calc(var(--s,80px) * -0.5);margin-top:calc(var(--s,80px) * -0.5);width:var(--s,80px);height:var(--s,80px);cursor:pointer;}
.flower:hover svg{filter:brightness(1.2);}
.flower svg{display:block;width:100%;height:100%;overflow:visible;}
.flower-inner{width:100%;height:100%;animation:bloomIn 1.6s cubic-bezier(.34,1.56,.64,1) backwards;}
@keyframes bloomIn{0%{transform:scale(0) rotate(-35deg);opacity:0;}55%{opacity:1;}100%{transform:scale(1) rotate(0deg);opacity:1;}}

.spark{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle, #FFFCE0 0%, var(--gold-light) 55%, transparent 100%);animation:sparkRise linear infinite;}
@keyframes sparkRise{0%{transform:translate(0,0) scale(.6);opacity:0;}12%{opacity:1;}55%{transform:translate(18px,-160px) scale(1);opacity:1;}100%{transform:translate(-14px,-320px) scale(.4);opacity:0;}}

/* ---------- hero text ---------- */
.hero{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5;pointer-events:none;width:90%;max-width:700px;}
.hero .name{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.6em,6vw,3.6em);color:var(--name-color);letter-spacing:2px;text-shadow:0 0 30px var(--name-glow),0 0 70px var(--name-glow);animation:glow 3.2s ease-in-out infinite;}
.hero .subtitle{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:clamp(1em,3vw,1.8em);color:var(--text-strong);margin-top:10px;text-shadow:0 0 20px rgba(255,215,0,.5);}
.hero .tagline{font-family:'Inter',sans-serif;font-weight:300;font-size:clamp(.8em,2.2vw,1.2em);color:var(--text-soft);margin-top:14px;letter-spacing:1px;opacity:.9;}
@keyframes glow{0%,100%{text-shadow:0 0 30px var(--name-glow),0 0 70px var(--name-glow);transform:scale(1);}50%{text-shadow:0 0 50px var(--name-glow),0 0 100px var(--name-glow);transform:scale(1.03);}}

/* ---------- theme toggle ---------- */
.theme-toggle{position:fixed;top:22px;right:22px;z-index:20;width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);background:rgba(0,0,0,.3);color:var(--gold);font-size:1.3em;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(255,215,0,.4);transition:transform .3s ease, box-shadow .3s ease;}
.theme-toggle:hover{transform:scale(1.1) rotate(15deg);box-shadow:0 0 35px rgba(255,215,0,.8);}
:root[data-theme="light"] .theme-toggle{background:rgba(255,255,255,.55);}

/* ---------- celestial body (real crescent moon / sun) ---------- */
.celestial{position:fixed;top:6%;right:9%;z-index:1;width:110px;height:110px;border-radius:50%;pointer-events:none;transition:opacity .8s ease;}
.celestial.sun{
    background:radial-gradient(circle, #FFFCE0 0%, #FFD700 42%, rgba(255,180,0,.25) 72%, transparent 100%);
    box-shadow:0 0 100px 45px rgba(255,215,0,.45);
}
.celestial.moon{
    background:
        radial-gradient(circle at 62% 28%, rgba(170,150,110,.4) 0 5px, transparent 6px),
        radial-gradient(circle at 44% 58%, rgba(170,150,110,.35) 0 8px, transparent 9px),
        radial-gradient(circle at 70% 68%, rgba(170,150,110,.3) 0 4px, transparent 5px),
        radial-gradient(circle at 32% 32%, #FFFDF2 0%, #FFF3B0 55%, #E4CE86 100%);
    -webkit-mask-image:radial-gradient(circle at 27% 50%, transparent 45%, black 46%);
    mask-image:radial-gradient(circle at 27% 50%, transparent 45%, black 46%);
    box-shadow:0 0 65px 22px rgba(255,240,180,.25);
}

/* ---------- navigation: compass minimap ---------- */
.navpanel{position:fixed;top:22px;left:22px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.minimap{position:relative;width:60px;height:60px;border-radius:50%;border:2px solid var(--gold);background:rgba(0,0,0,.35);box-shadow:0 0 14px rgba(255,215,0,.35);pointer-events:none;}
.minimap::before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(to right, transparent 49%, rgba(255,215,0,.25) 50%, transparent 51%),linear-gradient(to bottom, transparent 49%, rgba(255,215,0,.25) 50%, transparent 51%);}
.minimap-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold-light);box-shadow:0 0 8px var(--gold);top:50%;left:50%;transform:translate(-50%,-50%);}
.center-btn{pointer-events:auto;background:rgba(0,0,0,.35);border:1px solid var(--gold);color:var(--gold);font-size:.75em;padding:6px 14px;border-radius:20px;cursor:pointer;transition:background .2s ease;font-family:'Inter',sans-serif;letter-spacing:.5px;}
.center-btn:hover{background:rgba(255,215,0,.18);}
:root[data-theme="light"] .minimap{background:rgba(255,255,255,.55);}
:root[data-theme="light"] .center-btn{background:rgba(255,255,255,.55);}
:root[data-theme="light"] .center-btn:hover{background:rgba(255,215,0,.35);}

/* ---------- navigation: d-pad (360 orbit) ---------- */
.dpad{position:fixed;bottom:22px;right:22px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;}
.dpad-row{display:flex;gap:4px;}
.dpad button{pointer-events:auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--gold);background:rgba(0,0,0,.35);color:var(--gold);font-size:1.1em;cursor:pointer;transition:background .2s ease, transform .15s ease;}
.dpad button:active{transform:scale(.92);background:rgba(255,215,0,.25);}
.dpad .zoom-btn{font-size:1.25em;font-weight:700;}
:root[data-theme="light"] .dpad button{background:rgba(255,255,255,.55);}

/* ---------- hint ---------- */
.hint{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:20;font-family:'Inter',sans-serif;font-size:.8em;color:var(--text-soft);background:rgba(0,0,0,.25);padding:8px 16px;border-radius:30px;border:1px solid rgba(255,215,0,.3);opacity:1;transition:opacity 1.2s ease;pointer-events:none;text-align:center;max-width:82vw;}
.hint.fade{opacity:0;}

/* ---------- attribution ---------- */
.attribution{position:fixed;bottom:18px;left:22px;z-index:20;font-family:'Inter',sans-serif;font-size:.82em;color:var(--attribution-color);letter-spacing:.5px;pointer-events:none;text-shadow:0 0 12px rgba(255,215,0,.3);}
.attribution span{font-weight:600;color:var(--gold);}

/* ---------- modal ---------- */
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);align-items:center;justify-content:center;animation:fadeIn .4s ease;padding:20px;}
.modal.active{display:flex;}
.modal-content{position:relative;background:var(--modal-bg);padding:50px 40px 40px;border-radius:22px;text-align:center;max-width:560px;width:100%;border:2px solid var(--modal-border);box-shadow:0 0 60px rgba(255,215,0,.45), inset 0 0 40px rgba(255,215,0,.08);animation:slideIn .5s cubic-bezier(.2,.8,.3,1);}
.modal-flower{width:56px;height:56px;margin:0 auto 16px;filter:drop-shadow(0 0 18px rgba(255,215,0,.8));}
.modal-content .divider{width:70px;height:2px;margin:18px auto;background:linear-gradient(90deg, transparent, var(--gold), transparent);}
.modal-content p{font-family:'Inter',sans-serif;font-weight:500;color:var(--text-strong);font-size:1.25em;line-height:1.65;text-shadow:0 0 12px rgba(255,215,0,.25);}
.modal-content .signature{font-family:'Inter',sans-serif;font-size:.8em;color:var(--attribution-color);margin-top:20px;letter-spacing:1px;}
.close-btn{margin-top:26px;background:linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);color:#1a0f00;border:none;padding:13px 38px;font-size:1em;font-weight:600;border-radius:50px;cursor:pointer;box-shadow:0 0 20px rgba(255,215,0,.6);transition:transform .3s ease, box-shadow .3s ease;}
.close-btn:hover{transform:scale(1.08);box-shadow:0 0 40px rgba(255,215,0,1);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideIn{from{opacity:0;transform:scale(.85) translateY(-40px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* ---------- mobile ---------- */
@media (max-width:700px){
    .navpanel{top:14px;left:14px;}
    .minimap{width:46px;height:46px;}
    .center-btn{font-size:.68em;padding:5px 10px;}
    .dpad{bottom:14px;right:14px;}
    .dpad button{width:36px;height:36px;font-size:1em;}
    .theme-toggle{top:14px;right:14px;width:42px;height:42px;font-size:1.1em;}
    .celestial{width:64px;height:64px;top:11%;right:18%;}
    .attribution{bottom:12px;left:14px;font-size:.72em;}
    .hint{font-size:.7em;padding:6px 12px;top:14px;}
    .modal-content{padding:36px 24px 30px;}
    .modal-content p{font-size:1.1em;}
}
@media (prefers-reduced-motion: reduce){
    .flower,.star,.nebula,.hero .name,.flower-inner,.spark{animation:none !important;}
}
</style>
</head>
<body>

<div id="scene">
    <div id="starsLayer"></div>
    <div id="camera">
        <div id="tilt">
            <div id="nebulaLayer"></div>
            <div id="sparksLayer"></div>
            <div id="flowersLayer"></div>
        </div>
    </div>
</div>

<div class="hero">
    <div class="name">Cristina Polanco</div>
    <div class="subtitle">21 de Septiembre</div>
    <div class="tagline">Una galaxia de flores amarillas, flotando solo para ti ✨</div>
</div>

<div class="celestial" id="celestial"></div>
<button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema" title="Modo claro / oscuro">🌙</button>

<div class="navpanel">
    <div class="minimap"><div class="minimap-dot" id="minimapDot"></div></div>
    <button class="center-btn" id="centerBtn" title="Volver al centro">Centro</button>
</div>

<div class="dpad" id="dpad">
    <button data-dir="up" aria-label="Mirar arriba">↑</button>
    <div class="dpad-row">
        <button data-dir="left" aria-label="Girar izquierda">←</button>
        <button data-dir="zoomout" class="zoom-btn" aria-label="Alejar">－</button>
        <button data-dir="zoomin" class="zoom-btn" aria-label="Acercar">＋</button>
        <button data-dir="right" aria-label="Girar derecha">→</button>
    </div>
    <button data-dir="down" aria-label="Mirar abajo">↓</button>
</div>

<div class="hint" id="hint">arrastra para girar 360° · ↑↓←→ o rueda ＋／－ para acercar · toca una flor</div>
<div class="attribution">con cariño de <span>Steve Sánchez</span> 💛</div>

<div class="modal" id="messageModal">
    <div class="modal-content">
        <svg class="modal-flower" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="100" cy="40" rx="24" ry="44" fill="#FFD700" transform="rotate(0 100 100)"/>
            <ellipse cx="100" cy="40" rx="24" ry="44" fill="#FFD700" transform="rotate(72 100 100)"/>
            <ellipse cx="100" cy="40" rx="24" ry="44" fill="#FFD700" transform="rotate(144 100 100)"/>
            <ellipse cx="100" cy="40" rx="24" ry="44" fill="#FFD700" transform="rotate(216 100 100)"/>
            <ellipse cx="100" cy="40" rx="24" ry="44" fill="#FFD700" transform="rotate(288 100 100)"/>
            <circle cx="100" cy="100" r="20" fill="#FF8C42"/>
        </svg>
        <p id="messageText">Que estas flores amarillas sean un pedacito de sol entre tus manos.</p>
        <div class="divider"></div>
        <div class="signature">para Cristina, con cariño de Steve</div>
        <button class="close-btn" onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script>
(function(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = window.matchMedia('(max-width:700px)').matches || ('ontouchstart' in window && window.innerWidth < 1000);

    /* ---------------- THEME (auto by local hour, then manual override) ---------------- */
    const themeToggle = document.getElementById('themeToggle');
    const celestial = document.getElementById('celestial');
    const hourNow = new Date().getHours();
    const autoTheme = (hourNow >= 6 && hourNow < 19) ? 'light' : 'dark';
    const savedTheme = localStorage.getItem('galaxyTheme') || autoTheme;

    function setTheme(theme){
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
        celestial.className = 'celestial ' + (theme === 'dark' ? 'moon' : 'sun');
        localStorage.setItem('galaxyTheme', theme);
    }
    setTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
    });

    /* ---------------- HINT FADE ---------------- */
    setTimeout(() => document.getElementById('hint').classList.add('fade'), 6500);

    /* ---------------- STARS (yellow) ---------------- */
    const starsLayer = document.getElementById('starsLayer');
    const STAR_COUNT = isMobile ? 160 : 280;
    for(let i=0;i<STAR_COUNT;i++){
        const s = document.createElement('div');
        s.className='star';
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*100+'%';
        const size = Math.random()*3+1;
        s.style.width = size+'px';
        s.style.height = size+'px';
        s.style.animationDelay = Math.random()*3.5+'s';
        starsLayer.appendChild(s);
    }

    /* ---------------- NEBULAS ---------------- */
    const nebulaLayer = document.getElementById('nebulaLayer');
    [
        {x:'12%',y:'18%',s:420,c:'rgba(107,45,143,.5)'},
        {x:'78%',y:'70%',s:520,c:'rgba(255,140,66,.35)'},
        {x:'50%',y:'42%',s:600,c:'rgba(255,215,0,.22)'},
        {x:'22%',y:'82%',s:460,c:'rgba(255,215,0,.18)'},
        {x:'82%',y:'14%',s:480,c:'rgba(107,45,143,.35)'}
    ].forEach((n,i)=>{
        const d=document.createElement('div');
        d.className='nebula';
        d.style.left=n.x;d.style.top=n.y;
        d.style.width=n.s+'px';d.style.height=n.s+'px';
        d.style.background=n.c;
        d.style.animationDelay=(i*1.3)+'s';
        nebulaLayer.appendChild(d);
    });

    /* ---------------- REALISTIC FLOWER SVG BUILDERS (flat-color layered, no gradients) ---------------- */
    /* Note: SVG <radialGradient>/<linearGradient> fills were found to intermittently fail to
       paint under this scene's continuous CSS 3D transforms (a Chromium/Skia rendering quirk),
       causing flowers to look "deformed" (empty/spiky). All shading below is done with layered
       flat colors + a soft highlight ellipse instead, which paints reliably at any angle/zoom. */

    function petalRing(count, rx, ry, dist, fill, opacity, startAngle){
        startAngle = startAngle || 0;
        let out = '';
        for(let i=0;i<count;i++){
            const angle = startAngle + (360/count)*i;
            out += `<ellipse cx="100" cy="${100-dist}" rx="${rx}" ry="${ry}" fill="${fill}" opacity="${opacity}" transform="rotate(${angle} 100 100)"/>`;
        }
        return out;
    }

    function sheen(cx,cy,rx,ry){
        return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#FFFFFF" opacity="0.16"/>`;
    }

    /* Soft vector glow baked into the SVG itself (instead of a CSS filter) so it
       scales perfectly at any zoom level without ever pixelating. */
    function glow(){
        return `<circle cx="100" cy="100" r="118" fill="#FFD700" opacity="0.07"/><circle cx="100" cy="100" r="95" fill="#FFE066" opacity="0.1"/>`;
    }

    function svgDaisy(){
        return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
            ${glow()}
            ${petalRing(5,23,44,60,'#D68A00',0.9)}
            ${petalRing(5,19,38,58,'#FFD700',0.98)}
            <circle cx="100" cy="100" r="19" fill="#E67300"/>
            <circle cx="100" cy="100" r="10" fill="#FFC15C" opacity="0.85"/>
            ${sheen(78,72,28,20)}
        </svg>`;
    }

    function svgDoubleDaisy(){
        return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
            ${glow()}
            ${petalRing(6,20,42,58,'#C98A00',0.85,15)}
            ${petalRing(5,18,34,52,'#FFD700',0.95)}
            ${petalRing(5,14,26,48,'#FFED4E',0.95)}
            <circle cx="100" cy="100" r="17" fill="#E67300"/>
            <circle cx="100" cy="100" r="9" fill="#FFC15C" opacity="0.85"/>
            ${sheen(76,70,26,18)}
        </svg>`;
    }

    function svgTulip(){
        return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
            ${glow()}
            <ellipse cx="82" cy="70" rx="26" ry="46" fill="#C97A00" opacity="0.9" transform="rotate(-18 82 70)"/>
            <ellipse cx="118" cy="70" rx="26" ry="46" fill="#D69800" opacity="0.9" transform="rotate(18 118 70)"/>
            <ellipse cx="100" cy="62" rx="27" ry="50" fill="#FFD700"/>
            <ellipse cx="90" cy="45" rx="8" ry="18" fill="#FFFFFF" opacity="0.3" transform="rotate(-10 90 45)"/>
            <circle cx="100" cy="95" r="12" fill="#B85E00" opacity="0.7"/>
        </svg>`;
    }

    function svgSunflower(){
        let seeds='';
        for(let i=0;i<24;i++){
            const a = i*137.5;
            const r = 3+i*1.4;
            const rad = a*Math.PI/180;
            const cx = 100+Math.cos(rad)*r*0.85;
            const cy = 100+Math.sin(rad)*r*0.85;
            if(r>29) continue;
            seeds += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.1" fill="#3E2200" opacity="0.55"/>`;
        }
        return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
            ${glow()}
            ${petalRing(8,20,46,63,'#C97A00',0.85)}
            ${petalRing(8,20,46,63,'#FFD700',0.97,22.5)}
            ${petalRing(8,14,34,58,'#FFD700',0.55,22.5)}
            <circle cx="100" cy="100" r="32" fill="#6B3410"/>
            <circle cx="100" cy="100" r="20" fill="#8B4A1E" opacity="0.7"/>
            ${seeds}
        </svg>`;
    }

    function bloomAt(bx, by, scale, petalFill, centerFill, highlightFill){
        const rx=15*scale, ry=28*scale, dist=26*scale, cr=11*scale;
        let out='';
        for(let i=0;i<5;i++){
            const angle=72*i;
            out += `<ellipse cx="${bx}" cy="${(by-dist).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${petalFill}" opacity="0.95" transform="rotate(${angle} ${bx} ${by})"/>`;
        }
        out += `<ellipse cx="${bx}" cy="${(by-dist*0.6).toFixed(1)}" rx="${(rx*0.4).toFixed(1)}" ry="${(ry*0.35).toFixed(1)}" fill="${highlightFill}" opacity="0.35"/>`;
        out += `<circle cx="${bx}" cy="${by}" r="${cr.toFixed(1)}" fill="${centerFill}"/>`;
        return out;
    }

    function svgBouquet(){
        return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
            ${glow()}
            <path d="M 100 150 Q 70 135 65 108" stroke="#3d6b1f" stroke-width="5" fill="none" opacity="0.85"/>
            <path d="M 100 150 Q 130 135 135 108" stroke="#3d6b1f" stroke-width="5" fill="none" opacity="0.85"/>
            <ellipse cx="70" cy="120" rx="13" ry="6" fill="#4d8c2a" opacity="0.85" transform="rotate(-25 70 120)"/>
            <ellipse cx="130" cy="120" rx="13" ry="6" fill="#4d8c2a" opacity="0.85" transform="rotate(25 130 120)"/>
            ${bloomAt(72,72,0.9,'#FFD700','#E67300','#FFFCEA')}
            ${bloomAt(128,72,0.9,'#FFC700','#E67300','#FFFCEA')}
        </svg>`;
    }

    const flowerBuildersAll = [svgDaisy, svgDaisy, svgDoubleDaisy, svgTulip, svgSunflower, svgBouquet];
    const flowerBuildersSimple = [svgDaisy, svgDaisy, svgDoubleDaisy, svgTulip, svgSunflower];

    /* ---------------- POETIC MESSAGES ---------------- */
    const mensajes = [
        "Que estas flores amarillas sean un pedacito de sol entre tus manos.",
        "Hoy te regalo flores amarillas para que recuerdes que la alegría también florece.",
        "Así como estas flores, que nunca te falte color ni esperanza.",
        "Estas flores amarillas llevan un mensaje: nunca dejes de brillar.",
        "Que estas flores hablen por mí cuando las palabras no alcancen.",
        "Que cada pétalo te abrace como lo haría yo si pudiera.",
        "Flores amarillas para llenar de luz lo cotidiano.",
        "Que este pequeño detalle te saque una sonrisa inesperada.",
        "Amarillo como la luz que traes, como la calma que siento contigo.",
        "Hoy no solo florece la estación, también florece lo que siento por ti.",
        "En este 21 de septiembre, te regalo flores porque amarte es como la primavera.",
        "Estas flores también dicen: me alegra mucho tenerte.",
        "Cada estrella de esta galaxia brilla un poco más porque tú existes.",
        "Un ramo entero de gratitud, flotando en el espacio, solo para ti.",
        "Si el universo tuviera un color, hoy sería amarillo, como tu sonrisa.",
        "Que estas flores amarillas sean un pedacito de sol entre tus manos, Cristina.",
        "Hay personas que iluminan sin esfuerzo; tú eres una de ellas.",
        "Esta flor floreció solo para recordarte lo especial que eres.",
        "El amarillo existe para que el mundo recuerde tu forma de sonreír.",
        "No hacen falta muchas palabras cuando una flor puede decir 'te quiero'.",
        "Que la alegría te encuentre tan seguido como el sol encuentra estas flores.",
        "Cada pétalo es un 'gracias por existir' flotando hacia ti.",
        "Como el sol a las flores, así de constante es el cariño que te tengo.",
        "Hoy, 21 de septiembre, el universo entero se puso amarillo por ti.",
        "Eres de esas personas que hacen que hasta las galaxias quieran brillar más.",
        "Ninguna flor es tan bonita como el recuerdo de tu risa.",
        "Que cada rincón de este cielo amarillo te recuerde cuánto vales.",
        "Las flores se marchitan, pero lo que siento por ti no tiene fecha de caducidad.",
        "Un pequeño universo de pétalos dorados, dedicado enteramente a ti.",
        "Si pudiera regalarte una galaxia, la llenaría de flores amarillas y de tu nombre.",
        "Hoy quise convertir el cielo en un jardín solo para verte sonreír.",
        "Que la luz de estas flores te acompañe incluso en los días grises.",
        "Cristina, cada flor de esta galaxia lleva tu nombre escrito en secreto."
    ];

    /* ---------------- 360° CYLINDRICAL NAVIGATION ---------------- */
    const scene = document.getElementById('scene');
    const cameraEl = document.getElementById('camera');
    const tiltEl = document.getElementById('tilt');
    const flowersLayer = document.getElementById('flowersLayer');
    const minimapDot = document.getElementById('minimapDot');

    const W = window.innerWidth, H = window.innerHeight;

    const DEFAULT_ROT_X=-13, DEFAULT_ROT_Y=22, DEFAULT_ZOOM=360;
    let targetRotX=DEFAULT_ROT_X, targetRotY=DEFAULT_ROT_Y, curRotX=DEFAULT_ROT_X, curRotY=DEFAULT_ROT_Y;
    let targetZoom=DEFAULT_ZOOM, curZoom=DEFAULT_ZOOM;
    let dragging=false, dragStartX=0, dragStartY=0, rotXAtStart=0, rotYAtStart=0, dragMoved=0;
    let sceneDown=false, tapX=0, tapY=0;

    scene.addEventListener('pointerdown', e=>{
        dragging=true; dragMoved=0; sceneDown=true;
        dragStartX=e.clientX; dragStartY=e.clientY;
        tapX=e.clientX; tapY=e.clientY;
        rotXAtStart=targetRotX; rotYAtStart=targetRotY;
        scene.classList.add('dragging');
    });
    window.addEventListener('pointermove', e=>{
        if(!dragging) return;
        const dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
        dragMoved = Math.max(dragMoved, Math.hypot(dx,dy));
        targetRotY = rotYAtStart + dx*0.35;
        targetRotX = Math.min(58, Math.max(-58, rotXAtStart - dy*0.28));
    });
    window.addEventListener('pointerup', e=>{
        dragging=false; scene.classList.remove('dragging');
        /* Robust tap-to-flower detection: overlapping flower bounding boxes mean
           the native topmost element at a point isn't always the visible flower
           the user meant to tap, so we scan every element under the pointer
           (not just the top one) and open the message of the first flower found. */
        if(sceneDown && dragMoved<=14){
            const pt = document.elementsFromPoint ? document.elementsFromPoint(e.clientX, e.clientY) : [document.elementFromPoint(e.clientX, e.clientY)];
            for(const node of pt){
                const fl = node && node.closest ? node.closest('.flower') : null;
                if(fl && fl.__msg){ showMessage(fl.__msg); break; }
            }
        }
        sceneDown=false;
    });

    scene.addEventListener('wheel', e=>{
        e.preventDefault();
        targetZoom = Math.min(420, Math.max(-450, targetZoom - e.deltaY*0.5));
    }, {passive:false});

    document.getElementById('centerBtn').addEventListener('click', ()=>{
        targetRotX=DEFAULT_ROT_X; targetRotY=DEFAULT_ROT_Y; targetZoom=DEFAULT_ZOOM;
    });
    document.getElementById('dpad').addEventListener('click', e=>{
        const btn = e.target.closest('button');
        if(!btn) return;
        switch(btn.dataset.dir){
            case 'up':    targetRotX = Math.min(58, targetRotX+10); break;
            case 'down':  targetRotX = Math.max(-58, targetRotX-10); break;
            case 'left':  targetRotY -= 22; break;
            case 'right': targetRotY += 22; break;
            case 'zoomin':  targetZoom = Math.min(420, targetZoom+80); break;
            case 'zoomout': targetZoom = Math.max(-450, targetZoom-80); break;
        }
    });

    /* ---------------- FLOWERS: placed evenly around a full 360° cylinder ---------------- */
    const flowers = [];
    const FLOWER_COUNT = isMobile ? 26 : 46;
    const RINGS = [
        {radius:320, count:Math.round(FLOWER_COUNT*0.36), yRange:340, sizeMin:75, sizeMax:130, builders:flowerBuildersAll},
        {radius:480, count:Math.round(FLOWER_COUNT*0.36), yRange:420, sizeMin:60, sizeMax:100, builders:flowerBuildersAll},
        {radius:650, count:Math.round(FLOWER_COUNT*0.28), yRange:500, sizeMin:48, sizeMax:80, builders:flowerBuildersSimple}
    ];

    /* Shuffled index pool so every flower gets its own dedication (cycling once
       the pool is exhausted), guaranteeing none are ever left without a message. */
    const msgPool = mensajes.map((_,i)=>i);
    for(let i=msgPool.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [msgPool[i],msgPool[j]]=[msgPool[j],msgPool[i]];
    }
    let msgCursor=0;
    function nextMessage(){
        const msg = mensajes[msgPool[msgCursor % msgPool.length]];
        msgCursor++;
        return msg;
    }

    RINGS.forEach(ring=>{
        const slice = 360/ring.count;
        for(let i=0;i<ring.count;i++){
            const el = document.createElement('div');
            el.className='flower';
            const builder = ring.builders[Math.floor(Math.random()*ring.builders.length)];
            const size = ring.sizeMin + Math.random()*(ring.sizeMax-ring.sizeMin);
            el.style.setProperty('--s', size+'px');
            el.innerHTML = reduceMotion
                ? builder()
                : `<div class="flower-inner" style="animation-delay:${(i*0.05).toFixed(2)}s">${builder()}</div>`;

            const angle = slice*i + (Math.random()-0.5)*slice*0.7;
            const radius = ring.radius + (Math.random()-0.5)*70;
            const ySign = Math.random()<0.5 ? -1 : 1;
            const yOffset = ySign * (ring.yRange*0.12 + Math.random()*ring.yRange*0.5);

            const flower = {
                el, angle, radius, yOffset,
                phase: Math.random()*Math.PI*2,
                freq: 0.2+Math.random()*0.3,
                amp: 8+Math.random()*16,
                spin: Math.random()*360,
                spinSpeed: (Math.random()-0.5)*10
            };

            el.__msg = nextMessage();

            flowersLayer.appendChild(el);
            flowers.push(flower);
        }
    });

    /* ---------------- FLOATING LIGHT SPARKS ---------------- */
    if(!reduceMotion){
        const sparksLayer = document.getElementById('sparksLayer');
        const SPARK_COUNT = isMobile ? 20 : 42;
        for(let i=0;i<SPARK_COUNT;i++){
            const s = document.createElement('div');
            s.className='spark';
            const size = Math.random()*4+2;
            s.style.width = size+'px';
            s.style.height = size+'px';
            const angle = Math.random()*360;
            const radius = 200+Math.random()*450;
            const rad = angle*Math.PI/180;
            s.style.left = (50 + Math.sin(rad)*22)+'%';
            s.style.top = 35+Math.random()*55+'%';
            s.style.transform = `translateZ(${(Math.cos(rad)*radius).toFixed(0)}px)`;
            s.style.animationDuration = (5+Math.random()*6)+'s';
            s.style.animationDelay = (Math.random()*8)+'s';
            sparksLayer.appendChild(s);
        }
    }

    /* ---------------- MODAL ---------------- */
    function showMessage(msg){
        document.getElementById('messageText').textContent = msg;
        document.getElementById('messageModal').classList.add('active');
    }
    window.closeModal = function(){
        document.getElementById('messageModal').classList.remove('active');
    };
    window.addEventListener('click', e=>{
        if(e.target.id==='messageModal') closeModal();
    });

    /* ---------------- ANIMATION LOOP ---------------- */
    let lastTime = performance.now();
    function animate(now){
        const dt = Math.min(0.05,(now-lastTime)/1000);
        lastTime = now;
        const t = now/1000;

        curRotX += (targetRotX-curRotX)*0.08;
        curRotY += (targetRotY-curRotY)*0.08;
        curZoom += (targetZoom-curZoom)*0.08;

        cameraEl.style.transform = `translateZ(${curZoom}px)`;
        tiltEl.style.transform = `rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;

        const rad = (-curRotY)*Math.PI/180;
        minimapDot.style.left = (50 + Math.sin(rad)*40)+'%';
        minimapDot.style.top = (50 - Math.cos(rad)*40)+'%';

        if(!reduceMotion){
            flowers.forEach(f=>{
                f.spin += f.spinSpeed*dt;
                const bob = Math.sin(t*f.freq + f.phase)*f.amp;
                const facing = 180 - curRotY - f.angle;
                f.el.style.transform =
                    `rotateY(${f.angle}deg) translateZ(${f.radius}px) translateY(${f.yOffset+bob}px) rotateY(${facing}deg) rotate(${f.spin}deg)`;
            });
        }
        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    if(reduceMotion){
        flowers.forEach(f=>{
            const facing = 180 - curRotY - f.angle;
            f.el.style.transform = `rotateY(${f.angle}deg) translateZ(${f.radius}px) translateY(${f.yOffset}px) rotateY(${facing}deg)`;
        });
    }
})();
</script>
</body>
</html>
